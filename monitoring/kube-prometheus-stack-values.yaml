grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ops-agent
      group_by: [alertname, cluster, namespace]
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 4h
    receivers:
      - name: ops-agent
        webhook_configs:
          - url: http://ops-agent-svc.default.svc.cluster.local:5000/api/alerts/prometheus
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: change-me-alert-token

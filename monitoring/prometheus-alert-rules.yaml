apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ops-agent-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ops-agent
      rules:
        - alert: OpsAgentDown
          expr: absent(up{job=~".*ops-agent.*"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Ops Agent 无法被 Prometheus 抓取
            description: Ops Agent metrics target 已连续 2 分钟不可用。

        - alert: OpsAgentHigh5xxRate
          expr: |
            sum(rate(ops_agent_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(ops_agent_http_requests_total[5m])), 0.001)
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Ops Agent 5xx 比例超过 5%
            description: 最近 5 分钟 Ops Agent HTTP 请求错误率持续过高。

        - alert: OpsAgentRunFailures
          expr: ops_agent_recent_failed_runs > 0
          labels:
            severity: warning
          annotations:
            summary: AgentRun 执行失败
            description: 最近 10 分钟内存在诊断任务失败。

        - alert: OpsAgentRemediationFailure
          expr: ops_agent_recent_failed_executions > 0
          labels:
            severity: critical
          annotations:
            summary: 自动修复或结果验证失败
            description: 受控修复没有成功完成，需要人工处理。

        - alert: RedisDown
          expr: redis_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Redis 不可用
            description: Redis exporter 报告目标实例不可用。

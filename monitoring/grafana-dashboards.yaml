apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ops-agent-dashboard.json: |
    {
      "title": "K8s Ops Agent 监控面板",
      "uid": "ops-agent",
      "panels": [
        {
          "title": "Pod 状态",
          "type": "stat",
          "targets": [
            {
              "expr": "count(kube_pod_status_ready{namespace=\"default\",pod=~\"ops-agent-.*\",condition=\"true\"} == 1)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "title": "CPU 使用率",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"ops-agent-.*\",container!=\"\"}[5m])) by (pod)"
            }
          ]
        },
        {
          "title": "内存使用率",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",pod=~\"ops-agent-.*\",container!=\"\"}) by (pod)"
            }
          ]
        },
        {
          "title": "HTTP 请求速率",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(ops_agent_http_requests_total[5m])) by (status)"
            }
          ]
        },
        {
          "title": "Redis 连接状态",
          "type": "stat",
          "targets": [
            {
              "expr": "redis_up{namespace=\"default\"}"
            }
          ]
        },
        {
          "title": "Pod 重启次数",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"default\",pod=~\"ops-agent-.*\"})"
            }
          ]
        },
        {
          "title": "Agent 成功率",
          "type": "stat",
          "targets": [
            {"expr": "sum(rate(agent_runs_total{status=\"COMPLETED\"}[15m])) / clamp_min(sum(rate(agent_runs_total[15m])), 1)"}
          ]
        },
        {
          "title": "Agent 运行耗时",
          "type": "timeseries",
          "targets": [
            {"expr": "histogram_quantile(0.95, sum(rate(agent_run_duration_seconds_bucket[5m])) by (le))"}
          ]
        },
        {
          "title": "只读工具失败",
          "type": "timeseries",
          "targets": [
            {"expr": "sum(rate(agent_tool_calls_total{status!=\"SUCCEEDED\"}[5m])) by (tool,status)"}
          ]
        },
        {
          "title": "预算停止",
          "type": "timeseries",
          "targets": [
            {"expr": "sum(rate(agent_budget_exhausted_total[15m])) by (budget_type)"}
          ]
        },
        {
          "title": "人工接管",
          "type": "timeseries",
          "targets": [
            {"expr": "sum(rate(agent_human_handoff_total[15m])) by (reason)"}
          ]
        }
      ]
    }

apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-crashloop-mode
data:
  mode: crash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-crashloop
  labels:
    app: demo-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-crashloop
  template:
    metadata:
      labels:
        app: demo-crashloop
    spec:
      containers:
        - name: crash
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ "$(cat /config/mode)" = "healthy" ]; then
                echo "fault cleared; container is healthy"
                sleep 3600
              fi
              echo "injected CrashLoopBackOff"
              exit 1
          volumeMounts:
            - name: mode
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
      volumes:
        - name: mode
          configMap:
            name: demo-crashloop-mode

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-crashloop
  labels:
    app: demo-crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-crashloop
  template:
    metadata:
      labels:
        app: demo-crashloop
    spec:
      containers:
        - name: crash
          image: busybox:1.36
          command: [sh, -c, "echo injected CrashLoopBackOff; exit 1"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi


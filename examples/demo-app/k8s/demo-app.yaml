apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-todo
  labels:
    app: demo-todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-todo
  template:
    metadata:
      labels:
        app: demo-todo
    spec:
      containers:
        - name: demo
          image: demo-todo:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: demo-redis
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-todo
  labels:
    app: demo-todo
spec:
  selector:
    app: demo-todo
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-redis
  template:
    metadata:
      labels:
        app: demo-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: demo-redis
spec:
  selector:
    app: demo-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis


stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: "ops-agent"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"

test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r app/requirements.txt
  script:
    - python -m pytest app/tests/ -v --junitxml=reports/junit.xml
    - python -m pytest examples/demo-app/tests/ -v --junitxml=reports/demo-junit.xml
  artifacts:
    when: always
    reports:
      junit:
        - reports/junit.xml
        - reports/demo-junit.xml
    paths:
      - reports/

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -t $CI_REGISTRY_IMAGE:$DOCKER_TAG \
        -t $CI_REGISTRY_IMAGE:latest \
        -f docker/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$DOCKER_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - master

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - kubectl config use-context $KUBE_CONTEXT
  script:
    - kubectl delete job ops-agent-db-migrate -n default --ignore-not-found
    - |
      sed "s#image: ops-agent:v1#image: $CI_REGISTRY_IMAGE:$DOCKER_TAG#" \
        k8s/migration-job.yaml | kubectl apply -n default -f -
    - kubectl wait --for=condition=complete job/ops-agent-db-migrate -n default --timeout=180s
    - kubectl set image deployment/ops-agent ops-agent=$CI_REGISTRY_IMAGE:$DOCKER_TAG -n default
    - kubectl set image deployment/ops-agent-worker worker=$CI_REGISTRY_IMAGE:$DOCKER_TAG -n default
    - kubectl set image deployment/ops-agent-dispatcher dispatcher=$CI_REGISTRY_IMAGE:$DOCKER_TAG -n default
    - kubectl rollout status deployment/ops-agent -n default --timeout=120s
    - kubectl rollout status deployment/ops-agent-worker -n default --timeout=120s
    - kubectl rollout status deployment/ops-agent-dispatcher -n default --timeout=120s
  only:
    - main
    - master
  when: manual

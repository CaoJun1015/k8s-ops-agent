apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent-dispatcher
  labels:
    app: ops-agent-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-agent-dispatcher
  template:
    metadata:
      labels:
        app: ops-agent-dispatcher
    spec:
      serviceAccountName: ops-agent-dispatcher
      securityContext:
        runAsNonRoot: true
      containers:
        - name: dispatcher
          image: ops-agent:v1
          imagePullPolicy: IfNotPresent
          command: [python, -m, ops_agent.outbox]
          envFrom:
            - configMapRef:
                name: ops-agent-config
            - secretRef:
                name: ops-agent-secret
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

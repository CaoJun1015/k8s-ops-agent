apiVersion: v1
kind: Secret
metadata:
  name: ops-agent-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://ops_agent:change-me@postgres-svc:5432/ops_agent
  ALERT_WEBHOOK_TOKEN: change-me-alert-token
  OPERATOR_API_TOKEN: change-me-operator-token
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: ops_agent
  POSTGRES_USER: ops_agent
  POSTGRES_PASSWORD: change-me

apiVersion: v1
kind: Secret
metadata:
  name: ops-agent-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://ops_agent:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres-svc:5432/ops_agent"
  ALERT_WEBHOOK_TOKEN: "REPLACE_WITH_RANDOM_ALERT_TOKEN"
  OPERATOR_API_TOKEN: "REPLACE_WITH_RANDOM_OPERATOR_TOKEN"
  # Only add OPENAI_API_KEY when DIAGNOSIS_PROVIDER=rules+openai.
  # OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: ops_agent
  POSTGRES_USER: ops_agent
  POSTGRES_PASSWORD: "REPLACE_WITH_DATABASE_PASSWORD"

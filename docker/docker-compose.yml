version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ops_agent
      POSTGRES_USER: ops_agent
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_agent -d ops_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &ops-agent-env
      DATABASE_URL: "postgresql+psycopg://ops_agent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ops_agent"
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: rq
      EXECUTION_MODE: rq
      AGENT_CORE_ENABLED: "true"
      AGENT_REASONER_PROVIDER: "${AGENT_REASONER_PROVIDER:-rules}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.4-mini}"
      AGENT_MODEL_CONTEXT_WINDOW: "${AGENT_MODEL_CONTEXT_WINDOW:-0}"
      AGENT_MODEL_INPUT_LIMIT: "${AGENT_MODEL_INPUT_LIMIT:-12000}"
      AGENT_MODEL_OUTPUT_TOKENS: "${AGENT_MODEL_OUTPUT_TOKENS:-1000}"
      AGENT_MODEL_SAFETY_MARGIN: "${AGENT_MODEL_SAFETY_MARGIN:-512}"
      AGENT_EVIDENCE_TTLS: "${AGENT_EVIDENCE_TTLS:-}"
      AUTO_REMEDIATE_ENABLED: "false"
      ALLOWED_NAMESPACES: default
      REQUIRE_OPERATOR_AUTH: "true"
      OPERATOR_API_TOKEN: "${OPERATOR_API_TOKEN:?Set OPERATOR_API_TOKEN in .env}"
      ALERT_WEBHOOK_TOKEN: "${ALERT_WEBHOOK_TOKEN:?Set ALERT_WEBHOOK_TOKEN in .env}"
    depends_on:
      postgres:
        condition: service_healthy

  flask:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    environment: *ops-agent-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "agent-runs"]
    restart: always
    environment: *ops-agent-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  execution-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "executions"]
    restart: always
    environment: *ops-agent-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dispatcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "ops_agent.outbox"]
    restart: always
    environment: *ops-agent-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile.nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - flask

volumes:
  postgres-data:
  redis-data:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K8s Ops Agent</title>
  <style>
    :root { color-scheme: dark; --bg:#08111f; --panel:#101d30; --line:#23344e; --text:#e8eef8; --muted:#94a3b8; --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at top right,#172554 0,var(--bg) 42%); color:var(--text); min-height:100vh; }
    header { padding:28px 36px 18px; display:flex; align-items:end; justify-content:space-between; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; letter-spacing:-.04em; }
    header p { margin:6px 0 0; color:var(--muted); }
    .live { color:var(--ok); font-size:13px; }
    main { padding:24px 36px 40px; max-width:1440px; margin:auto; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
    .stat,.panel { background:rgba(16,29,48,.92); border:1px solid var(--line); border-radius:14px; }
    .stat { padding:18px; }
    .stat span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .stat strong { display:block; font-size:28px; margin-top:6px; }
    .grid { display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
    .workflow { margin-top:18px; }
    .evidence-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 18px 18px; }
    .evidence-card { background:#091525; border:1px solid var(--line); border-radius:9px; padding:11px; min-width:0; }
    .evidence-card pre { color:var(--muted); font-size:11px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:92px; overflow:hidden; }
    .panel { overflow:hidden; }
    .panel-head { padding:16px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .panel h2 { font-size:16px; margin:0; }
    .list { max-height:560px; overflow:auto; }
    .item { padding:15px 18px; border-bottom:1px solid var(--line); cursor:pointer; }
    .item:hover { background:#14243b; }
    .item-title { display:flex; justify-content:space-between; gap:12px; font-weight:650; }
    .meta { color:var(--muted); font-size:12px; margin-top:7px; display:flex; gap:12px; flex-wrap:wrap; }
    .badge { border:1px solid var(--line); padding:2px 7px; border-radius:999px; font-size:11px; }
    .CRITICAL,.HIGH { color:var(--bad); } .MEDIUM { color:var(--warn); } .LOW,.DONE,.RESOLVED { color:var(--ok); }
    form { padding:16px 18px; display:grid; gap:10px; border-bottom:1px solid var(--line); }
    input,select,textarea { width:100%; padding:10px 11px; color:var(--text); background:#091525; border:1px solid var(--line); border-radius:8px; }
    textarea { min-height:70px; resize:vertical; }
    button { border:0; border-radius:8px; padding:9px 12px; background:var(--accent); color:#042033; font-weight:700; cursor:pointer; }
    button.secondary { background:#263a57; color:var(--text); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .actions { display:flex; gap:8px; margin-top:10px; }
    .empty { color:var(--muted); padding:32px 18px; text-align:center; }
    .error { color:var(--bad); padding:10px 18px; display:none; }
    @media (max-width:900px) { .stats{grid-template-columns:repeat(2,1fr)} .grid,.evidence-grid{grid-template-columns:1fr} header,main{padding-left:18px;padding-right:18px} }
  </style>
</head>
<body>
  <header>
    <div><h1>⚙ K8s Ops Agent</h1><p>事件 · 诊断 · 行动项 · 受控修复</p></div>
    <div class="live" id="health">● 正在检查</div>
  </header>
  <main>
    <section class="stats">
      <div class="stat"><span>活动事件</span><strong id="openCount">0</strong></div>
      <div class="stat"><span>严重事件</span><strong id="criticalCount">0</strong></div>
      <div class="stat"><span>待处理任务</span><strong id="taskCount">0</strong></div>
      <div class="stat"><span>已完成任务</span><strong id="doneCount">0</strong></div>
    </section>
    <div class="grid">
      <section class="panel">
        <div class="panel-head"><h2>Incident 事件中心</h2><button class="secondary" onclick="loadAll()">刷新</button></div>
        <form id="incidentForm">
          <input id="incidentTitle" maxlength="200" placeholder="手动登记事件标题" required>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <input id="resourceName" placeholder="资源名，例如 demo-123" required>
            <select id="severity"><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option><option>LOW</option></select>
          </div>
          <button type="submit">创建事件</button>
        </form>
        <div id="incidentError" class="error"></div>
        <div class="list" id="incidentList"><div class="empty">暂无事件</div></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Action Task 行动项</h2><span class="badge" id="selectedIncident">请选择事件</span></div>
        <form id="taskForm">
          <input id="taskTitle" maxlength="200" placeholder="为所选事件添加行动项" required disabled>
          <select id="taskPriority" disabled><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option><option>LOW</option></select>
          <button id="taskSubmit" type="submit" disabled>添加行动项</button>
        </form>
        <div id="taskError" class="error"></div>
        <div class="list" id="taskList"><div class="empty">选择一个 Incident 查看行动项</div></div>
      </section>
    </div>
    <section class="panel workflow">
      <div class="panel-head"><h2>诊断与证据</h2><span class="badge" id="diagnosisStatus">请选择事件</span></div>
      <div id="diagnosisList"><div class="empty">选择一个 Incident 查看最新诊断</div></div>
    </section>
    <section class="panel workflow">
      <div class="panel-head">
        <h2>Plan / Execution 受控修复</h2>
        <input id="operatorToken" type="password" placeholder="Operator Token（仅当前页面内存）" style="max-width:330px">
      </div>
      <div id="workflowError" class="error"></div>
      <div class="list" id="workflowList"><div class="empty">选择一个 Incident 查看修复工作流</div></div>
    </section>
  </main>
  <script>
    let incidents=[], tasks=[], plans=[], executions=[], runs=[], evidence=[], selectedId=null;
    const escapeHtml = value => { const node=document.createElement('div'); node.textContent=value ?? ''; return node.innerHTML; };
    async function api(path, options={}) {
      const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
      const data=await response.json();
      if(!response.ok) throw new Error(data.error?.message || `HTTP ${response.status}`);
      return data;
    }
    async function loadAll() {
      try {
        [incidents,tasks,plans,executions,runs]=await Promise.all([api('/api/incidents'),api('/api/tasks'),api('/api/plans'),api('/api/executions'),api('/api/agent-runs')]);
        renderIncidents(); renderTasks(); renderWorkflow(); renderStats(); await loadEvidence();
        const ready=await api('/ready'); document.getElementById('health').textContent=ready.status==='ok'?'● 系统就绪':'● 依赖异常';
      } catch(error) { showError('incidentError',error.message); }
    }
    function renderStats() {
      document.getElementById('openCount').textContent=incidents.filter(i=>!['RESOLVED','CLOSED'].includes(i.status)).length;
      document.getElementById('criticalCount').textContent=incidents.filter(i=>i.severity==='CRITICAL'&&!['RESOLVED','CLOSED'].includes(i.status)).length;
      document.getElementById('taskCount').textContent=tasks.filter(t=>!['DONE','CANCELLED'].includes(t.status)).length;
      document.getElementById('doneCount').textContent=tasks.filter(t=>t.status==='DONE').length;
    }
    function renderIncidents() {
      const list=document.getElementById('incidentList');
      if(!incidents.length){list.innerHTML='<div class="empty">暂无事件</div>';return;}
      list.innerHTML=incidents.map(i=>`<div class="item" onclick="selectIncident('${i.id}')">
        <div class="item-title"><span>${escapeHtml(i.title)}</span><span class="${i.severity}">${i.severity}</span></div>
        <div class="meta"><span>${escapeHtml(i.namespace)}/${escapeHtml(i.resource_name)}</span><span class="badge">${i.status}</span><span>告警 ×${i.occurrence_count}</span></div>
        ${i.status==='OPEN'?`<div class="actions"><button onclick="event.stopPropagation();diagnose('${i.id}')">启动诊断</button></div>`:''}
        ${i.status==='DIAGNOSED'&&i.resource_kind==='Pod'?`<div class="actions"><button onclick="event.stopPropagation();createRestartPlan('${i.id}')">生成 Pod 重建计划</button></div>`:''}
      </div>`).join('');
    }
    async function selectIncident(id) {
      selectedId=id; const incident=incidents.find(item=>item.id===id);
      document.getElementById('selectedIncident').textContent=incident?.title||id;
      for(const id of ['taskTitle','taskPriority','taskSubmit']) document.getElementById(id).disabled=false;
      renderTasks(); renderWorkflow(); await loadEvidence();
    }
    async function loadEvidence() {
      const node=document.getElementById('diagnosisStatus');
      if(!selectedId){evidence=[];node.textContent='请选择事件';renderDiagnosis();return;}
      const latest=runs.filter(item=>item.incident_id===selectedId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
      if(!latest){evidence=[];node.textContent='尚无诊断';renderDiagnosis();return;}
      node.textContent=latest.status;
      evidence=await api(`/api/agent-runs/${latest.id}/evidence`);
      renderDiagnosis(latest);
    }
    function renderDiagnosis(run) {
      const list=document.getElementById('diagnosisList');
      if(!selectedId){list.innerHTML='<div class="empty">选择一个 Incident 查看最新诊断</div>';return;}
      if(!run){list.innerHTML='<div class="empty">该事件尚无诊断记录</div>';return;}
      const diagnosis=run.diagnosis||{};
      const summary=`<div class="item"><div class="item-title"><span>${escapeHtml(diagnosis.diagnosis_code||'等待诊断')}</span><span class="badge">置信度 ${Math.round((diagnosis.confidence||0)*100)}%</span></div><div class="meta"><span>${escapeHtml(diagnosis.summary||run.error||'诊断进行中')}</span><span>${escapeHtml(diagnosis.provider||'')}</span></div></div>`;
      const cards=evidence.map(item=>{const preview=JSON.stringify(item.content,null,2).slice(0,500);return `<div class="evidence-card"><div class="item-title"><span>${escapeHtml(item.evidence_type)}</span><span class="badge">${escapeHtml(item.source)}</span></div><pre>${escapeHtml(preview)}</pre></div>`;}).join('');
      list.innerHTML=summary+(cards?`<div class="evidence-grid">${cards}</div>`:'<div class="empty">暂无证据</div>');
    }
    function operatorHeaders() {
      const token=document.getElementById('operatorToken').value.trim();
      return {'Authorization':`Bearer ${token}`,'X-Actor-ID':'ops-console-user'};
    }
    function renderWorkflow() {
      const list=document.getElementById('workflowList');
      if(!selectedId){list.innerHTML='<div class="empty">选择一个 Incident 查看修复工作流</div>';return;}
      const incidentPlans=plans.filter(p=>p.incident_id===selectedId);
      if(!incidentPlans.length){list.innerHTML='<div class="empty">该事件暂无修复计划</div>';return;}
      list.innerHTML=incidentPlans.map(p=>{
        const related=executions.filter(e=>e.plan_id===p.id);
        return `<div class="item"><div class="item-title"><span>${escapeHtml(p.action_type)}</span><span class="badge">${p.status}</span></div>
          <div class="meta"><span>${escapeHtml(p.target.namespace)}/${escapeHtml(p.target.pod_name)}</span><span>风险 ${p.risk_level}</span><span>${p.dry_run_result?.reason||'尚未 dry-run'}</span></div>
          <div class="actions">
            ${p.status==='DRAFT'?`<button onclick="dryRun('${p.id}')">执行 dry-run</button>`:''}
            ${p.status==='AWAITING_APPROVAL'?`<button onclick="approvePlan('${p.id}')">批准</button><button class="secondary" onclick="rejectPlan('${p.id}')">拒绝</button>`:''}
            ${p.status==='EXECUTABLE'?`<button onclick="executePlan('${p.id}')">执行修复</button>`:''}
          </div>
          ${related.map(e=>`<div class="meta"><span>Execution</span><span class="badge ${e.status}">${e.status}</span><span>${e.verification_result?.healthy===true?'验证通过':escapeHtml(e.error||'等待执行')}</span></div>`).join('')}
        </div>`;
      }).join('');
    }
    async function createRestartPlan(incidentId) {
      try { await api(`/api/incidents/${incidentId}/plans`,{method:'POST',body:JSON.stringify({action_type:'RESTART_CONTROLLER_MANAGED_POD',target:{}})}); await loadAll(); selectIncident(incidentId); }
      catch(error){showError('workflowError',error.message);}
    }
    async function dryRun(planId) {
      try { await api(`/api/plans/${planId}/dry-run`,{method:'POST'}); await loadAll(); selectIncident(selectedId); }
      catch(error){showError('workflowError',error.message);}
    }
    async function approvePlan(planId) {
      try { await api(`/api/plans/${planId}/approve`,{method:'POST',headers:operatorHeaders(),body:JSON.stringify({comment:'Ops Console 批准'})}); await loadAll(); selectIncident(selectedId); }
      catch(error){showError('workflowError',error.message);}
    }
    async function rejectPlan(planId) {
      try { await api(`/api/plans/${planId}/reject`,{method:'POST',headers:operatorHeaders(),body:JSON.stringify({comment:'Ops Console 拒绝'})}); await loadAll(); selectIncident(selectedId); }
      catch(error){showError('workflowError',error.message);}
    }
    async function executePlan(planId) {
      try { await api(`/api/plans/${planId}/execute`,{method:'POST',headers:{...operatorHeaders(),'Idempotency-Key':`ui-execution:${planId}`}}); await loadAll(); selectIncident(selectedId); }
      catch(error){showError('workflowError',error.message);}
    }
    function renderTasks() {
      const list=document.getElementById('taskList');
      if(!selectedId){list.innerHTML='<div class="empty">选择一个 Incident 查看行动项</div>';return;}
      const filtered=tasks.filter(t=>t.incident_id===selectedId);
      if(!filtered.length){list.innerHTML='<div class="empty">该事件暂无行动项</div>';return;}
      list.innerHTML=filtered.map(t=>`<div class="item"><div class="item-title"><span>${escapeHtml(t.title)}</span><span class="${t.priority}">${t.priority}</span></div>
        <div class="meta"><span class="badge ${t.status}">${t.status}</span><span>${t.task_type}</span></div>
        ${t.status==='TODO'?`<div class="actions"><button class="secondary" onclick="moveTask('${t.id}','IN_PROGRESS')">开始处理</button></div>`:''}
        ${t.status==='IN_PROGRESS'?`<div class="actions"><button onclick="moveTask('${t.id}','DONE')">标记完成</button><button class="secondary" onclick="moveTask('${t.id}','BLOCKED')">阻塞</button></div>`:''}
      </div>`).join('');
    }
    async function diagnose(id) {
      try { await api(`/api/incidents/${id}/agent-runs`,{method:'POST',body:JSON.stringify({mode:'DIAGNOSE_ONLY'}),headers:{'Idempotency-Key':`ui:${id}:${Date.now()}`}}); await loadAll(); }
      catch(error){showError('incidentError',error.message);}
    }
    async function moveTask(id,status) {
      try { await api(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({status})}); await loadAll(); }
      catch(error){showError('taskError',error.message);}
    }
    document.getElementById('incidentForm').addEventListener('submit',async event=>{
      event.preventDefault(); const resource=document.getElementById('resourceName').value.trim();
      try { const incident=await api('/api/incidents',{method:'POST',body:JSON.stringify({title:document.getElementById('incidentTitle').value,severity:document.getElementById('severity').value,fingerprint:`manual:default:Pod:${resource}:${Date.now()}`,cluster:'local',namespace:'default',resource_kind:'Pod',resource_name:resource,source:'manual'})}); event.target.reset(); selectedId=incident.id; await loadAll(); selectIncident(incident.id); }
      catch(error){showError('incidentError',error.message);}
    });
    document.getElementById('taskForm').addEventListener('submit',async event=>{
      event.preventDefault(); if(!selectedId)return;
      try { await api('/api/tasks',{method:'POST',body:JSON.stringify({incident_id:selectedId,title:document.getElementById('taskTitle').value,priority:document.getElementById('taskPriority').value,task_type:'MANUAL_CHECK'})}); event.target.reset(); await loadAll(); selectIncident(selectedId); }
      catch(error){showError('taskError',error.message);}
    });
    function showError(id,message){const node=document.getElementById(id);node.textContent=message;node.style.display='block';setTimeout(()=>node.style.display='none',5000);}
    loadAll();
  </script>
</body>
</html>
